<!doctype html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="fa-IR" href="{{canonical}}">
<link rel="alternate" hreflang="x-default" href="{{canonical}}">
<meta name="theme-color" content="{{site.theme_color}}">
<meta name="format-detection" content="telephone=no">
{{verification}}
<meta property="og:locale" content="fa_IR">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.title}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{og_image}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script>document.documentElement.classList.add("js")</script>
<link rel="preload" href="/assets/fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css?v={{ver}}">
<script src="/assets/js/main.js?v={{ver}}" defer></script>
{{json_ld}}
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
</body>
</html>

# Nginx server block for the Calendro landing site (static files from dist/).
# Copy dist/ to /var/www/calendro-landing, then:
#   sudo cp deploy/nginx-calendro.ir.conf /etc/nginx/sites-available/calendro.ir
#   sudo ln -s /etc/nginx/sites-available/calendro.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificate paths assume Let's Encrypt (certbot) — adjust if yours differ.

# www -> apex, http -> https (one canonical host is important for SEO)
server {
    listen 80;
    listen [::]:80;
    server_name calendro.ir www.calendro.ir;
    return 301 https://calendro.ir$request_uri;
}

server {
    # nginx >= 1.25.1: use `listen 443 ssl;` plus `http2 on;` instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.calendro.ir;
    ssl_certificate     /etc/letsencrypt/live/calendro.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendro.ir/privkey.pem;
    return 301 https://calendro.ir$request_uri;
}

server {
    # nginx >= 1.25.1: use `listen 443 ssl;` plus `http2 on;` instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name calendro.ir;

    ssl_certificate     /etc/letsencrypt/live/calendro.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendro.ir/privkey.pem;

    root /var/www/calendro-landing;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

    # Pages: always revalidate so content updates show up immediately
    location / {
        # /features -> /features/ (one URL per page; matches canonical tags)
        rewrite ^([^.]*[^/])$ $1/ permanent;
        try_files $uri $uri/index.html =404;
        # add_header in a location replaces server-level ones, so repeat them here
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Old .html style URLs, if any existed on the previous site, redirect here, e.g.:
    # location = /index.html { return 301 /; }

    # Versioned CSS/JS (?v=hash) and fonts: cache for a year
    location ~* \.(css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /robots.txt  { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /llms.txt    { default_type text/plain; charset utf-8; try_files $uri =404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
